<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rippen — 오늘 익힐 AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0a0a; font-family: 'SUIT', sans-serif; color: #0b0a0a; }

  .nav {
    background: #0b0a0a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 120px;
  }
  .logo { display: flex; align-items: center; cursor: pointer; }
  .logo.ghost { cursor: default; }
  .logo-lockup { height: 45px; width: auto; display: block; }
  .logo.ghost { visibility: hidden; }

  .tabs { display: flex; gap: 4px; border-radius: 99px; padding: 8px; }
  .tab-btn { background: none; border: none; padding: 8px 16px; font-family: 'SUIT', sans-serif; font-weight: 500; font-size: 15px; color: rgba(255,255,255,0.76); text-transform: uppercase; cursor: pointer; }
  .tab-btn.active { font-weight: 700; color: #fff; border-bottom: 2px solid #a461f6; padding-bottom: 5px; padding-top: 4px; }

  .today-shell { padding: 40px 120px 80px; }
  .today-card {
    background: #eaeaea;
    border-radius: 80px;
    padding: 60px 120px;
    position: relative;
    box-shadow: 3px 3px 0px black, inset 3px 3px 0px white;
  }
  .corner-dots { position: absolute; top: 47px; right: 98px; width: 51px; height: 51px; }
  .corner-dots .c1 { fill: #d9d9d9; }
  .corner-dots .c2 { fill: #c9c9c9; }

  .eyebrow { color: #9778bc; font-weight: 700; font-size: 20px; text-transform: uppercase; margin: 0 0 4px; }
  .tool-name { color: #7c11ff; font-weight: 900; font-size: 100px; margin: 0 0 40px; line-height: 1; }
  .what-is-it { color: #0b0b0a; font-weight: 700; font-size: 24px; line-height: 1.6; max-width: 1032px; margin: 0 0 24px; }

  .tags { display: flex; gap: 8px; margin-bottom: 60px; flex-wrap: wrap; }
  .tag { background: rgba(124,17,255,0.17); color: #7c11ff; font-weight: 500; font-size: 12px; padding: 5px 12px; white-space: nowrap; }

  .reason-row { display: flex; gap: 20px; margin-bottom: 60px; flex-wrap: wrap; }
  .reason-card { background: #7c11ff; border-radius: 44px; padding: 40px; flex: 1; min-width: 260px; min-height: 355px; }
  .reason-label { color: #daccec; font-weight: 700; font-size: 15px; text-transform: uppercase; margin: 0 0 41px; }
  .reason-text { color: #fff; font-weight: 700; font-size: 20px; line-height: 1.6; margin: 0; }

  .action-label { color: #7c11ff; font-weight: 700; font-size: 15px; text-transform: uppercase; margin: 0 0 16px; }
  .action-text { color: #0b0b0a; font-weight: 700; font-size: 24px; line-height: 1.6; margin: 0 0 20px; }
  .quick-link { color: #7c11ff; font-weight: 700; font-size: 14px; text-decoration: underline; display: inline-block; margin: 0 0 20px; }
  .cta { background: #fff; color: #0b0b0a; font-weight: 700; font-size: 15px; padding: 15px 28px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-family: 'SUIT', sans-serif; }
  .cta:hover:not(.done) { background: #5b1ea6; color: #fff; }
  .cta.done { background: #d6c8f0; cursor: default; }
  .cta svg { width: 20px; height: 20px; display: none; }
  .cta.done svg { display: block; }
  .cta.archived { background: #7c11ff; color: #fff; cursor: default; }
  .cta.archived svg { display: block; }
  .cta.archived svg path { stroke: #fff; }

  .back-link { color: rgba(255,255,255,0.76); font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; }
  .back-link:hover { color: #fff; }

  .growth-shell { padding: 40px 120px 80px; display: flex; gap: 0; align-items: flex-start; flex-wrap: wrap; }
  .growth-shell.detail-mode .grape-gallery,
  .growth-shell.detail-mode .growth-stats { display: none; }
  .growth-shell.detail-mode .hero-cluster-wrap { width: 340px; transform: scale(0.72); transform-origin: left center; margin-right: -60px; }
  .growth-shell:not(.detail-mode) .session-card { display: none; }

  .session-card {
    flex: 1;
    min-width: 280px;
    background: #eaeaea;
    border-radius: 48px;
    padding: 40px 48px;
    position: relative;
    box-shadow: 3px 3px 0px black, inset 3px 3px 0px white;
    margin-top: 60px;
  }
  .session-card .corner-dot { position: absolute; top: 24px; right: 24px; width: 28px; height: 28px; border-radius: 50%; background: #0b0a0a; }
  .session-card .eyebrow { color: #9778bc; font-weight: 700; font-size: 15px; text-transform: uppercase; margin: 0 0 4px; }
  .session-card h2 { color: #7c11ff; font-weight: 900; font-size: 56px; margin: 0 0 16px; }
  .session-card .desc { color: #0b0b0a; font-weight: 700; font-size: 16px; line-height: 1.6; margin: 0 0 16px; }
  .session-card .tags { display: flex; gap: 8px; margin-bottom: 32px; }
  .session-card .btn-row { display: flex; gap: 10px; justify-content: flex-end; }
  .session-card .btn-done { background: #fff; color: #0b0b0a; font-weight: 700; font-size: 14px; padding: 12px 20px; border: none; display: inline-flex; align-items: center; gap: 6px; font-family: 'SUIT', sans-serif; }
  .session-card .btn-revisit { background: #7c11ff; color: #fff; font-weight: 700; font-size: 14px; padding: 12px 20px; border: none; text-decoration: none; }

  .grape-gallery { width: 424px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 50px 0; height: 644px; }
  .gallery-tile { width: 98px; height: 97px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: #3a2157; cursor: pointer; transition: background 0.15s ease; }
  .gallery-tile.selected { background: #eaeaea; }
  .gallery-tile svg { width: 46px; height: 77px; }

  .hero-cluster-wrap { width: 424px; display: flex; align-items: center; justify-content: center; position: relative; height: 644px; }
  .hero-cluster { width: 240px; }
  .grape-dot { transition: opacity 0.15s ease; }
  .grape-dot.filled { cursor: pointer; }
  .grape-dot.hover-ring path { stroke: #fff; stroke-width: 8px; }

  .growth-stats { width: 424px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; gap: 12px; height: 644px; padding: 50px 0; }
  .cluster-label { color: #a461f6; font-weight: 700; font-size: 15px; margin-bottom: auto; }
  .stat-line { display: flex; gap: 40px; font-weight: 700; font-size: 15px; }
  .stat-line .k { color: #9778bc; }
  .stat-line .v { color: #a461f6; }

  .empty-state { color: rgba(255,255,255,0.5); font-size: 14px; padding: 20px 0; }
</style>
</head>
<body data-today="{{TODAY_DATE}}" data-tool="{{TOOL_NAME}}" data-category="{{TOOL_CATEGORY}}">

  <svg width="0" height="0" style="position:absolute;overflow:hidden">
    <defs>
      <filter id="stem-filter" x="-0.000444055" y="-0.000444055" width="187.212" height="76.9677" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feFlood flood-opacity="0" result="BackgroundImageFix"/>
        <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
        <feTurbulence type="fractalNoise" baseFrequency="0.99900001287460327 0.99900001287460327" numOctaves="3" seed="8318"/>
        <feDisplacementMap in="shape" scale="2.0321381092071533" xChannelSelector="R" yChannelSelector="G" result="displacedImage" width="100%" height="100%"/>
        <feMerge result="effect1_texture_44_1532">
          <feMergeNode in="displacedImage"/>
        </feMerge>
      </filter>
      <filter id="berry-filter" x="-0.000924826" y="5.17368e-05" width="104.637" height="104.636" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feFlood flood-opacity="0" result="BackgroundImageFix"/>
        <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
        <feTurbulence type="fractalNoise" baseFrequency="0.99900001287460327 0.99900001287460327" numOctaves="3" seed="1302"/>
        <feDisplacementMap in="shape" scale="2.1463809013366699" xChannelSelector="R" yChannelSelector="G" result="displacedImage" width="100%" height="100%"/>
        <feMerge result="effect1_texture_44_1554">
          <feMergeNode in="displacedImage"/>
        </feMerge>
      </filter>
      <!-- nav 로고 전용 필터. 로고는 본문 포도 클러스터의 축소판이 아니라
           사용자가 Figma에서 직접 export한 별도 에셋(logo.svg)이라 좌표/스케일이
           다르다 -->
      <filter id="logo-berry-filter" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.99900001287460327 0.99900001287460327" numOctaves="3" seed="1302"/>
        <feDisplacementMap in="SourceGraphic" scale="0.18326230347156525" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="logo-stem-filter" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.99900001287460327 0.99900001287460327" numOctaves="3" seed="8318"/>
        <feDisplacementMap in="SourceGraphic" scale="0.17350803315639496" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div class="nav">
    <div class="logo" onclick="showTab('today')" role="button" aria-label="오늘 익힐 AI로 돌아가기">
      <svg class="logo-lockup" viewBox="0 0 156 54"></svg>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tab-today" onclick="showTab('today')">Today</button>
      <button class="tab-btn" id="tab-growth" onclick="showTab('growth')">My Growth</button>
    </div>
    <div class="logo ghost">
      <svg class="logo-lockup" viewBox="0 0 156 54"></svg>
    </div>
  </div>

  <div id="today-panel">
    <div class="today-shell">
      <div class="today-card">
        <svg class="corner-dots" viewBox="0 0 51 51"><circle class="c1" cx="25.5" cy="25.5" r="25.5"/><circle class="c2" cx="24.5" cy="24.5" r="22.5"/></svg>

        <p class="eyebrow">오늘 익힐 AI</p>
        <h1 class="tool-name">{{TOOL_NAME}}</h1>

        <p class="what-is-it">{{WHAT_IS_IT}}</p>
        <div class="tags">
          <span class="tag">{{ONE_LINE_PURPOSE}}</span>
          <span class="tag">{{DIFFICULTY}}</span>
          <span class="tag">{{ESTIMATED_TIME}}</span>
        </div>

        <div class="reason-row">
          <div class="reason-card">
            <p class="reason-label">추천하는 이유</p>
            <p class="reason-text">{{WHY_NOW}}</p>
          </div>
          <div class="reason-card">
            <p class="reason-label">강화할 수 있는 역량</p>
            <p class="reason-text">{{WHY_IMPORTANT}}</p>
          </div>
          <div class="reason-card">
            <p class="reason-label">취업에 활용할 것</p>
            <p class="reason-text">{{JOB_APPLICATION}}</p>
          </div>
        </div>

        <p class="action-label">오늘 연습 해볼 것</p>
        <p class="action-text">{{TODAY_ACTION}}</p>
        {{QUICK_LINK_BLOCK}}
        <button class="cta" id="btn-complete" onclick="completeToday()">
          <span id="cta-label">연습 완료</span>
          <svg viewBox="0 0 20 20" fill="none"><path d="M4 10l4 4 8-8" stroke="#0b0b0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="growth-panel" style="display:none;">
    <div class="growth-shell" id="growth-shell">
      <div class="grape-gallery" id="gallery"></div>

      <div class="hero-cluster-wrap" id="hero-wrap">
        <svg class="hero-cluster" id="hero-cluster" viewBox="0 0 318 528">
          <g id="hero-stem-slot"></g>
        </svg>
      </div>

      <div class="growth-stats">
        <p class="cluster-label" id="cluster-label"></p>
        <div class="stat-line"><span class="k">다 익힌 포도</span><span class="v" id="stat-bunches">0 송이</span></div>
        <div class="stat-line"><span class="k">익어가는 포도</span><span class="v" id="stat-grains">0 알</span></div>
      </div>

      <div class="session-card" id="session-card">
        <div class="corner-dot"></div>
        <p class="eyebrow">익힌 AI</p>
        <h2 id="session-tool"></h2>
        <p class="desc" id="session-desc"></p>
        <div class="tags" id="session-tags"></div>
        <div class="btn-row">
          <button class="btn-done">연습 완료함
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M4 10l4 4 8-8" stroke="#0b0b0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <a class="btn-revisit" id="session-link" href="#">다시 보러 가기</a>
        </div>
      </div>
    </div>
  </div>

  <!-- 사람인 API(F1)로 채용공고 데이터를 다시 쓰기 시작하면, 이용약관에 따라
       아래 문구를 다시 넣어야 한다: Powered by 취업 사람인 (링크: http://www.saramin.co.kr) -->

  <script>
    var HISTORY_DATA = {{HISTORY_DATA_JSON}};
    var STORAGE_KEY = 'completedDates';
    var svgNS = 'http://www.w3.org/2000/svg';

    function loadCompleted() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
      catch (e) { return {}; }
    }
    function saveCompleted(map) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(map));
    }

    function showTab(name) {
      document.getElementById('today-panel').style.display = name === 'today' ? 'block' : 'none';
      document.getElementById('growth-panel').style.display = name === 'growth' ? 'block' : 'none';
      document.getElementById('tab-today').classList.toggle('active', name === 'today');
      document.getElementById('tab-growth').classList.toggle('active', name === 'growth');
      if (name === 'growth') { closeSession(); renderAll(); }
    }

    function completeToday() {
      var body = document.body;
      var completed = loadCompleted();
      completed[body.dataset.today] = true;
      saveCompleted(completed);
      refreshTodayButton();
      // 완료 상태로 바뀌는 게 잠깐 보이고 나서 My Growth로 자동 전환
      setTimeout(function () { showTab('growth'); }, 500);
    }

    function refreshTodayButton() {
      var body = document.body;
      var completed = loadCompleted();
      var btn = document.getElementById('btn-complete');
      if (completed[body.dataset.today]) {
        document.getElementById('cta-label').textContent = '연습 완료함';
        btn.classList.add('done');
        btn.disabled = true;
      }
    }

    // ---- 포도알/꼭지 모양 (포도송이.svg, 꼭지.svg에서 받은 실제 텍스처 shape) ----
    var BERRY_PATH = 'M52.3171 103.563C80.6189 103.563 103.562 80.6199 103.562 52.3181C103.562 24.0163 80.6189 1.07324 52.3171 1.07324C24.0154 1.07324 1.07227 24.0163 1.07227 52.3181C1.07227 80.6199 24.0154 103.563 52.3171 103.563Z';
    var BERRY_VIEWBOX = 105;
    var STEM_PATH = 'M89.6679 39.6262L91.5726 75.9507H124.468L126.5 39.6262L186.195 36.451V1.01562H1.01562V36.451L89.6679 39.6262Z';
    var STEM_COLOR = '#2c6473';
    var FILLED_COLOR = '#7c11ff';
    var EMPTY_COLOR = '#3a2157';
    var CLUSTER_SIZE = 11;

    // Figma "포도 1" 클러스터 프레임(317.32 x 527.05) 기준 좌표 (get_metadata로 추출)
    var CLUSTER_W = 317.32;
    var CLUSTER_H = 527.05;
    var BERRY_FRAME_SIZE = 102.4897;
    var STEM_FRAME = { x: 44.511, y: 1.016, w: 185.179 };
    var BERRY_FRAMES = [
      { x: 1.074,   y: 76.018 },
      { x: 104.636, y: 60.456 },
      { x: 206.857, y: 76.018 },
      { x: 49.367,  y: 164.019 },
      { x: 151.858, y: 159.458 },
      { x: 2.147,   y: 257.386 },
      { x: 104.636, y: 252.021 },
      { x: 213.565, y: 242.362 },
      { x: 57.417,  y: 344.852 },
      { x: 166.345, y: 332.241 },
      { x: 121.271, y: 423.462 }
    ];

    function makeBerry(x, y, scaleFactor) {
      scaleFactor = scaleFactor || 1;
      var s = (BERRY_FRAME_SIZE / BERRY_VIEWBOX) * scaleFactor;
      var g = document.createElementNS(svgNS, 'g');
      g.setAttribute('transform', 'translate(' + (x * scaleFactor) + ',' + (y * scaleFactor) + ') scale(' + s + ')');
      var p = document.createElementNS(svgNS, 'path');
      p.setAttribute('d', BERRY_PATH);
      p.setAttribute('filter', 'url(#berry-filter)');
      g.appendChild(p);
      return { group: g, path: p };
    }

    // useFilter: 텍스처 필터(feDisplacementMap)는 손그림 느낌을 주지만,
    // 갤러리 썸네일처럼 아주 작게 렌더링될 때는 왜곡이 도형 크기에 비해
    // 너무 커져서 형태가 뭉개져 보인다(꼭지가 네모난 얼룩처럼 보이는 버그의
    // 원인). 그래서 작은 사이즈로 그릴 때는 필터를 끈다.
    function stemSVG(scaleFactor, useFilter) {
      scaleFactor = scaleFactor || 1;
      useFilter = useFilter !== false;
      var s = (STEM_FRAME.w / 188) * scaleFactor;
      return '<g transform="translate(' + (STEM_FRAME.x * scaleFactor) + ',' + (STEM_FRAME.y * scaleFactor) + ') scale(' + s + ')">' +
        '<path d="' + STEM_PATH + '" fill="' + STEM_COLOR + '"' + (useFilter ? ' filter="url(#stem-filter)"' : '') + '/></g>';
    }

    // nav 로고(마크+워드마크)는 사용자가 Figma에서 직접 export한 logo.svg를
    // 그대로 옮긴 것 — 본문 포도 클러스터와는 독립적인 별도 에셋이라
    // 좌표를 임의로 계산하지 않고 원본 path data를 그대로 쓴다.
    var LOGO_STEM_PATH = 'M11.3701 7.88259L11.5327 10.984H14.3414L14.5149 7.88259L19.6117 7.61148V4.58594H3.80078V7.61148L11.3701 7.88259Z';
    var LOGO_BERRY_PATHS = [
      'M14.7309 49.407C17.1473 49.407 19.1062 47.4481 19.1062 45.0316C19.1062 42.6152 17.1473 40.6562 14.7309 40.6562C12.3144 40.6562 10.3555 42.6152 10.3555 45.0316C10.3555 47.4481 12.3144 49.407 14.7309 49.407Z',
      'M18.5785 41.618C20.995 41.618 22.9539 39.659 22.9539 37.2426C22.9539 34.8261 20.995 32.8672 18.5785 32.8672C16.1621 32.8672 14.2031 34.8261 14.2031 37.2426C14.2031 39.659 16.1621 41.618 18.5785 41.618Z',
      'M9.27773 42.6951C11.6942 42.6951 13.6531 40.7362 13.6531 38.3197C13.6531 35.9033 11.6942 33.9443 9.27773 33.9443C6.86127 33.9443 4.90234 35.9033 4.90234 38.3197C4.90234 40.7362 6.86127 42.6951 9.27773 42.6951Z',
      'M22.6098 33.9441C25.0262 33.9441 26.9852 31.9852 26.9852 29.5687C26.9852 27.1523 25.0262 25.1934 22.6098 25.1934C20.1933 25.1934 18.2344 27.1523 18.2344 29.5687C18.2344 31.9852 20.1933 33.9441 22.6098 33.9441Z',
      'M13.309 34.7684C15.7254 34.7684 17.6844 32.8094 17.6844 30.393C17.6844 27.9765 15.7254 26.0176 13.309 26.0176C10.8925 26.0176 8.93359 27.9765 8.93359 30.393C8.93359 32.8094 10.8925 34.7684 13.309 34.7684Z',
      'M4.55898 35.2264C6.97544 35.2264 8.93437 33.2674 8.93437 30.851C8.93437 28.4345 6.97544 26.4756 4.55898 26.4756C2.14252 26.4756 0.183594 28.4345 0.183594 30.851C0.183594 33.2674 2.14252 35.2264 4.55898 35.2264Z',
      'M17.3422 26.865C19.7586 26.865 21.7176 24.9061 21.7176 22.4896C21.7176 20.0732 19.7586 18.1143 17.3422 18.1143C14.9257 18.1143 12.9668 20.0732 12.9668 22.4896C12.9668 24.9061 14.9257 26.865 17.3422 26.865Z',

    function logoLockupMarkup() {
      var stem = '<path d="' + LOGO_STEM_PATH + '" fill="#2c6473" filter="url(#logo-stem-filter)"/>';
      var berries = LOGO_BERRY_PATHS.map(function (d) {
        return '<path d="' + d + '" fill="#a461f6" filter="url(#logo-berry-filter)"/>';
      }).join('');
      var wordmark = '<path d="' + LOGO_WORDMARK_PATH + '" fill="#a461f6"/>';
      return '<g transform="translate(0,4.5)">' + stem + berries + '</g>' + wordmark;
    }
    function renderLogoMarks() {
      var markup = logoLockupMarkup();
      document.querySelectorAll('.logo-lockup').forEach(function (svg) {
        svg.innerHTML = markup;
      });
    }

    function numToKorean(n) {
      var map = ['첫', '두', '세', '네', '다섯', '여섯', '일곱', '여덟', '아홉', '열'];
      return map[n - 1] || n;
    }

    var MAX_GALLERY_COMPLETED = 4;

    // 완료 총 개수(= "완료했어요"를 실제로 누른 회차 수, localStorage 기준)를
    // 11개 단위(내부적으로만 '송이'라고 부름 — 화면 표시는 Figma 기준 "개")로
    // 쪼갠다. 지금 채우고 있는 클러스터가 갤러리 맨 위, 완료된 클러스터는
    // 최신순으로 그 아래에 쌓인다. 완료된 클러스터가 4개를 넘으면 오래된
    // 것부터 갤러리에서는 안 보인다(통계 숫자에는 계속 반영됨).
    function buildBunches(total) {
      var full = Math.floor(total / CLUSTER_SIZE);
      var remainder = total % CLUSTER_SIZE;
      var currentOrdinal = full + 1;
      var currentBunch = { ordinal: currentOrdinal, fill: remainder, complete: remainder === 0 && total > 0 };

      var display = [currentBunch];
      for (var ord = full; ord >= Math.max(1, full - MAX_GALLERY_COMPLETED + 1); ord--) {
        display.push({ ordinal: ord, fill: CLUSTER_SIZE, complete: true });
      }
      return { display: display, totalCompleted: full };
    }

    function miniClusterSVG(fill) {
      var f = 46 / CLUSTER_W;
      var berries = BERRY_FRAMES.map(function (frame, i) {
        var color = i < fill ? FILLED_COLOR : EMPTY_COLOR;
        var s = (BERRY_FRAME_SIZE / BERRY_VIEWBOX) * f;
        return '<g transform="translate(' + (frame.x * f).toFixed(1) + ',' + (frame.y * f).toFixed(1) + ') scale(' + s.toFixed(3) + ')"><path d="' + BERRY_PATH + '" fill="' + color + '"/></g>';
      }).join('');
      var stem = stemSVG(f, false);
      return '<svg viewBox="0 0 ' + (CLUSTER_W * f).toFixed(1) + ' ' + (CLUSTER_H * f).toFixed(1) + '">' + stem + berries + '</svg>';
    }

    // ---- 실제 완료 기록 (HISTORY_DATA ∩ localStorage completedDates) ----
    var doneEntries = [];
    var bunchData = { display: [{ ordinal: 1, fill: 0, complete: false }], totalCompleted: 0 };
    var bunches = bunchData.display;
    var selectedIndex = 0;

    function computeDone() {
      var completed = loadCompleted();
      doneEntries = HISTORY_DATA
        .filter(function (e) { return completed[e.date]; })
        .sort(function (a, b) { return a.date < b.date ? -1 : 1; }); // 오래된 순 = 포도알이 채워진 순서
      bunchData = buildBunches(doneEntries.length);
      bunches = bunchData.display;
    }

    function renderStats() {
      var currentFill = bunches[0].fill;
      document.getElementById('stat-bunches').textContent = bunchData.totalCompleted + ' 송이';
      document.getElementById('stat-grains').textContent = currentFill + ' 알';
    }

    function renderGallery() {
      var gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      if (doneEntries.length === 0) {
        // Figma에 빈 상태 디자인이 없어서, 문구를 지어내지 않고 그냥 비워둔다.
        return;
      }
      bunches.forEach(function (b, i) {
        var tile = document.createElement('div');
        tile.className = 'gallery-tile' + (i === selectedIndex ? ' selected' : '');
        tile.innerHTML = miniClusterSVG(b.fill);
        tile.addEventListener('click', function () {
          selectedIndex = i;
          closeSession();
          renderAll();
        });
        gallery.appendChild(tile);
      });
    }

    var selectedDotEl = null;
    var currentEntry = null;

    function renderHero() {
      var svg = document.getElementById('hero-cluster');
      svg.querySelectorAll('.grape-dot').forEach(function (el) { el.remove(); });

      var stemSlot = document.getElementById('hero-stem-slot');
      stemSlot.innerHTML = stemSVG(1);

      var b = bunches[selectedIndex];
      BERRY_FRAMES.forEach(function (frame, i) {
        var filled = i < b.fill;
        var berry = makeBerry(frame.x, frame.y, 1);
        berry.group.setAttribute('class', 'grape-dot' + (filled ? ' filled' : ''));
        berry.path.setAttribute('fill', filled ? FILLED_COLOR : EMPTY_COLOR);
        if (filled) {
          berry.group.addEventListener('mouseenter', function () { berry.group.classList.add('hover-ring'); });
          berry.group.addEventListener('mouseleave', function () { berry.group.classList.remove('hover-ring'); });
          berry.group.addEventListener('click', function (evt) { evt.stopPropagation(); openSession(b, i, berry.group); });
        }
        svg.appendChild(berry.group);
      });
      document.getElementById('cluster-label').textContent = doneEntries.length > 0 ? numToKorean(b.ordinal) + '번째 포도' : '';
    }

    // 갤러리에서 선택된 송이(b)의 i번째 알이 doneEntries의 몇 번째 항목인지 계산해서
    // 실제로 그 회차에 어떤 툴이었는지 찾는다.
    function openSession(b, dotIndex, dotEl) {
      var globalIndex = (b.ordinal - 1) * CLUSTER_SIZE + dotIndex;
      var entry = doneEntries[globalIndex];
      if (!entry) return;
      currentEntry = entry;

      document.getElementById('session-tool').textContent = entry.tool;
      document.getElementById('session-desc').textContent = entry.what_is_it || '';
      var tagsHtml = '';
      if (entry.one_line_purpose) tagsHtml += '<span class="tag">' + entry.one_line_purpose + '</span>';
      if (entry.difficulty) tagsHtml += '<span class="tag">' + entry.difficulty + '</span>';
      if (entry.estimated_time) tagsHtml += '<span class="tag">' + entry.estimated_time + '</span>';
      document.getElementById('session-tags').innerHTML = tagsHtml;
      document.getElementById('session-link').href = 'archive/' + entry.date + '.html';

      if (selectedDotEl) selectedDotEl.classList.remove('hover-ring');
      selectedDotEl = dotEl;
      selectedDotEl.classList.add('hover-ring');

      document.getElementById('growth-shell').classList.add('detail-mode');
    }

    function closeSession() {
      document.getElementById('growth-shell').classList.remove('detail-mode');
      if (selectedDotEl) { selectedDotEl.classList.remove('hover-ring'); selectedDotEl = null; }
    }

    // 카드/포도알 바깥을 클릭하면 기본 화면(갤러리+통계)으로 돌아간다
    document.addEventListener('click', function (e) {
      var shell = document.getElementById('growth-shell');
      if (!shell.classList.contains('detail-mode')) return;
      if (e.target.closest('#session-card') || e.target.classList.contains('grape-dot')) return;
      closeSession();
    });

    function renderAll() {
      computeDone();
      if (selectedIndex >= bunches.length) selectedIndex = 0;
      renderStats();
      renderGallery();
      renderHero();
    }

    refreshTodayButton();
    renderLogoMarks();
  </script>
